databases:
  - name: watt-triage-db
    databaseName: watt
    user: watt
    plan: free

services:
  - type: web
    name: watt-triage-api
    runtime: python
    plan: free
    buildCommand: "pip install uv && uv sync --frozen --no-dev"
    startCommand: "uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: watt-triage-db
          property: connectionString
      - key: WRITE_API_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: ""
      - key: AGENT_MAX_RUNS_PER_HOUR
        value: "50"
