[project]
name = "watt-triage"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "psycopg[binary,pool]",
    "anthropic>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "pyright>=1.1.414",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
